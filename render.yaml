services:
  - type: web
    name: parcelpilot-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m db.setup && python -m rag.indexer
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
